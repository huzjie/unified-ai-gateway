<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#0f172a"/>
  <text x="400" y="40" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="bold">数据流：一次 /v1/chat/completions</text>
  <rect x="40" y="70" width="140" height="50" rx="8" fill="#1e293b" stroke="#1976d2"/>
  <text x="110" y="95" font-size="12" fill="#e2e8f0" text-anchor="middle">Client</text>
  <text x="110" y="110" font-size="10" fill="#94a3b8" text-anchor="middle">Bearer sk-xxx</text>
  <rect x="240" y="70" width="140" height="50" rx="8" fill="#1e293b" stroke="#7c4dff"/>
  <text x="310" y="95" font-size="12" fill="#e2e8f0" text-anchor="middle">鉴权 + 限流</text>
  <text x="310" y="110" font-size="10" fill="#94a3b8" text-anchor="middle">Key 哈希校验 / QPS</text>
  <rect x="440" y="70" width="140" height="50" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="510" y="95" font-size="12" fill="#e2e8f0" text-anchor="middle">路由 + 熔断</text>
  <text x="510" y="110" font-size="10" fill="#94a3b8" text-anchor="middle">候选决策 / 状态机</text>
  <rect x="640" y="70" width="130" height="50" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="705" y="95" font-size="12" fill="#e2e8f0" text-anchor="middle">上游 Provider</text>
  <text x="705" y="110" font-size="10" fill="#94a3b8" text-anchor="middle">Kimi/DeepSeek...</text>
  <line x1="180" y1="95" x2="240" y2="95" stroke="#334155" stroke-width="2"/>
  <line x1="380" y1="95" x2="440" y2="95" stroke="#334155" stroke-width="2"/>
  <line x1="580" y1="95" x2="640" y2="95" stroke="#334155" stroke-width="2"/>
  <rect x="240" y="200" width="140" height="50" rx="8" fill="#1e293b" stroke="#06b6d4"/>
  <text x="310" y="225" font-size="12" fill="#e2e8f0" text-anchor="middle">成本计算</text>
  <text x="310" y="240" font-size="10" fill="#94a3b8" text-anchor="middle">单价 × tokens（微元）</text>
  <rect x="440" y="200" width="140" height="50" rx="8" fill="#1e293b" stroke="#ec4899"/>
  <text x="510" y="225" font-size="12" fill="#e2e8f0" text-anchor="middle">落库 + 聚合</text>
  <text x="510" y="240" font-size="10" fill="#94a3b8" text-anchor="middle">usage_logs / daily_stats</text>
  <line x1="510" y1="120" x2="510" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="4"/>
  <line x1="310" y1="120" x2="310" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="4"/>
  <rect x="40" y="320" width="720" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="345" font-size="12" fill="#e2e8f0" text-anchor="middle">响应头透传：x-request-id / x-uag-provider / x-uag-failover / x-uag-cost</text>
  <text x="400" y="365" font-size="12" fill="#94a3b8" text-anchor="middle">失败自动故障转移：Kimi 挤爆 → DeepSeek 兜底，业务零改动</text>
</svg>

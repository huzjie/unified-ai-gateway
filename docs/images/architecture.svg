<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Unified AI Gateway 架构</text>
  <rect x="20" y="70" width="760" height="60" rx="8" fill="#1e293b" stroke="#1976d2"/>
  <text x="400" y="105" font-size="16" fill="#e2e8f0" text-anchor="middle">接入层 apps/gateway（Fastify 5 · OpenAI 兼容 API + 管理 API）</text>
  <rect x="20" y="150" width="360" height="60" rx="8" fill="#1e293b" stroke="#7c4dff"/>
  <text x="200" y="185" font-size="14" fill="#e2e8f0" text-anchor="middle">核心引擎 packages/core</text>
  <text x="200" y="200" font-size="11" fill="#94a3b8" text-anchor="middle">路由 / 限流 / 熔断 / 成本 / 事件</text>
  <rect x="420" y="150" width="360" height="60" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="600" y="185" font-size="14" fill="#e2e8f0" text-anchor="middle">适配器层 packages/providers</text>
  <text x="600" y="200" font-size="11" fill="#94a3b8" text-anchor="middle">OpenAI/Moonshot/DeepSeek/MiniMax/Anthropic/Ollama/Mock</text>
  <rect x="20" y="230" width="360" height="60" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="200" y="265" font-size="14" fill="#e2e8f0" text-anchor="middle">存储层 packages/storage</text>
  <text x="200" y="280" font-size="11" fill="#94a3b8" text-anchor="middle">better-sqlite3 + 迁移 + Repository</text>
  <rect x="420" y="230" width="360" height="60" rx="8" fill="#1e293b" stroke="#06b6d4"/>
  <text x="600" y="265" font-size="14" fill="#e2e8f0" text-anchor="middle">共享类型 packages/types</text>
  <text x="600" y="280" font-size="11" fill="#94a3b8" text-anchor="middle">全仓唯一类型来源</text>
  <rect x="20" y="310" width="360" height="60" rx="8" fill="#1e293b" stroke="#ec4899"/>
  <text x="200" y="345" font-size="14" fill="#e2e8f0" text-anchor="middle">管理面 apps/web</text>
  <text x="200" y="360" font-size="11" fill="#94a3b8" text-anchor="middle">React 19 + MUI + Tailwind 控制台</text>
  <rect x="420" y="310" width="360" height="60" rx="8" fill="#1e293b" stroke="#ec4899"/>
  <text x="600" y="345" font-size="14" fill="#e2e8f0" text-anchor="middle">管理面 apps/cli</text>
  <text x="600" y="360" font-size="11" fill="#94a3b8" text-anchor="middle">gateway-cli 命令行工具</text>
  <text x="400" y="420" font-size="12" fill="#94a3b8" text-anchor="middle">依赖方向：web/cli → gateway → core + providers + storage，providers/storage/core → types</text>
  <text x="400" y="460" font-size="12" fill="#94a3b8" text-anchor="middle">技术栈：Node.js 20 · TypeScript 5 · Fastify 5 · better-sqlite3 · React 19 · Vite 6 · pnpm workspace</text>
</svg>
